# InventCraft for macOS, the preview build, for Apple Silicon Macs.
#
# Built on GitHub's own Apple Silicon machines, since IITEG has no Mac.
# A tag v* builds it and attaches it to that tag's GitHub release, making
# the release if there is none yet; run by hand, it builds and keeps the
# zip as an artifact.  The macOS support itself came from @calumk (#5).
#
# The gate is the core tests and the build's own self test, which loads
# OpenCASCADE, starts a worker process, translates a STEP file, draws a
# view and writes a PDF.  The window tests and the 3D view check run too,
# for what they show, but do not stop the build: these machines have no
# graphics card, so OpenGL there proves little either way.
#
# The app is signed for this Mac only ("ad hoc"), not by an Apple
# developer account, so a Mac asks before opening it the first time; see
# docs/MACOS.md.

name: macOS build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cadquery-ocp==7.9.3.1.1 PySide6==6.11.2 numpy \
            cryptography pyinstaller
          pip install hidapi || echo "no hidapi: SpaceMouse support left out"

      - name: Version
        id: version
        run: |
          version=$(python -c "import datum; print(datum.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "InventCraft $version for macOS"

      - name: Core tests
        run: python tests/run.py --fast

      # capped: with no graphics card a window suite can wait for ever on
      # a view that never draws, and the first run sat here over an hour
      - name: Window tests (for information)
        continue-on-error: true
        timeout-minutes: 15
        run: python tests/run.py -j 2

      - name: The beaver, as a Mac icon
        run: |
          set -e
          src=tools/macos/inventcraft-1024.png
          set_dir=build/InventCraft.iconset
          mkdir -p "$set_dir"
          for size in 16 32 128 256 512; do
            sips -z $size $size "$src" --out "$set_dir/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double "$src" --out "$set_dir/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$set_dir" -o build/InventCraft.icns
          ls -l build/InventCraft.icns

      - name: Build
        env:
          DATUM_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller --noconfirm --distpath dist --workpath build/macos tools/datum_macos.spec

      - name: Self test
        run: |
          dist/InventCraft.app/Contents/MacOS/InventCraft --selftest selftest.txt || true
          cat selftest.txt
          grep -q "PASS" selftest.txt

      - name: The 3D view opens (for information)
        continue-on-error: true
        run: |
          dist/InventCraft.app/Contents/MacOS/InventCraft --glcheck glcheck.txt || true
          cat glcheck.txt
          grep -q "PASS" glcheck.txt

      - name: Sign for opening on any Mac (ad hoc)
        run: |
          codesign --deep --force --sign - dist/InventCraft.app
          codesign --verify --deep --strict dist/InventCraft.app

      - name: Pack
        id: pack
        run: |
          name="InventCraft-${{ steps.version.outputs.version }}-macos-arm64.zip"
          mkdir -p pack
          cp -R dist/InventCraft.app pack/
          cp docs/MACOS.md pack/README-MACOS.md
          ditto -c -k --sequesterRsrc --keepParent pack "$name"
          ls -l "$name"
          shasum -a 256 "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "InventCraft ${tag#v}" \
              --notes "See https://datum.iiteg.com/changelog.html"
          fi
          gh release upload "$tag" "${{ steps.pack.outputs.name }}" --clobber
