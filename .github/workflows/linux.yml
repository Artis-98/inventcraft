# InventCraft for Linux.
#
# Built on Ubuntu 22.04, so it runs on that and anything newer: the
# OpenCASCADE wheels need glibc 2.31 or later.  A tag v* builds it and
# attaches it to that tag's GitHub release, making the release if there is
# none yet; run by hand, it builds and keeps the tarball as an artifact.
#
# The gate is the core tests and the build's own self test, which loads
# OpenCASCADE, starts a worker process, translates a STEP file, draws a
# view and writes a PDF.  The window tests run too, for what they show,
# but do not stop the build: a virtual screen is not a desktop.

name: Linux build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Only run this test, with a native traceback on a crash (e.g. test_point_states)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries for Qt and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libegl1 libglu1-mesa libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-xfixes0 libxcb-sync1 libxrender1 libxi6 libsm6 libice6 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 gdb
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cadquery-ocp==7.9.3.1.1 PySide6==6.11.2 numpy cryptography
      - name: Run it
        env:
          QT_QPA_PLATFORM: xcb
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          fc-list | head -5 || true
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            python -X faulthandler -u "tests/${{ inputs.diagnose }}.py" || \
            echo "exit code $?"

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnose == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: System libraries for Qt and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libegl1 libglu1-mesa libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-xfixes0 libxcb-sync1 libxrender1 libxi6 libsm6 libice6 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cadquery-ocp==7.9.3.1.1 PySide6==6.11.2 numpy \
            cryptography pyinstaller certifi
          pip install hidapi || echo "no hidapi: SpaceMouse support left out"

      - name: Version
        id: version
        run: |
          version=$(python -c "import datum; print(datum.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "InventCraft $version"

      - name: Core tests
        run: python tests/run.py --fast

      - name: Window tests (for information)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/run.py -j 2

      - name: Build
        run: pyinstaller --noconfirm --distpath dist --workpath build/linux tools/datum_linux.spec

      - name: Self test
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" dist/InventCraft/InventCraft --selftest selftest.txt || true
          cat selftest.txt
          grep -q "PASS" selftest.txt

      - name: The 3D view opens, on this runner
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" dist/InventCraft/InventCraft --glcheck glcheck.txt || true
          cat glcheck.txt
          grep -q "PASS" glcheck.txt

      # Ubuntu 22.04 is what it was built on, so it proves little about a
      # newer distribution: a build that carried its own copies of the
      # system's libraries opened fine here and could not get OpenGL on
      # CachyOS (GitHub #3).  Arch is as new as any, so the window is
      # opened there too, with Arch's own Mesa.
      - name: The 3D view opens, on a current distribution (Arch)
        run: |
          docker run --rm -v "$PWD/dist:/dist" archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth mesa \
              libglvnd libxkbcommon-x11 xcb-util-cursor xcb-util-wm \
              xcb-util-image xcb-util-keysyms xcb-util-renderutil libxi libsm \
              fontconfig ttf-dejavu dbus > /dev/null
            cd /tmp
            LIBGL_DEBUG=verbose xvfb-run -a -s "-screen 0 1600x1000x24" \
              /dist/InventCraft/InventCraft --glcheck /tmp/glcheck.txt || true
            cat /tmp/glcheck.txt
            grep -q PASS /tmp/glcheck.txt'

      # The build's OpenSSL looks for certificates where Ubuntu keeps them,
      # so on Fedora every update check failed (GitHub #7).  The check is
      # made for real, against the live feed, on both.
      - name: Updates can be checked, on Arch and Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist" archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed mesa libglvnd libxkbcommon-x11 \
              fontconfig dbus > /dev/null
            /dist/InventCraft/InventCraft --checkupdate | tee /tmp/u.txt
            grep -q PASS /tmp/u.txt'
          docker run --rm -v "$PWD/dist:/dist" fedora:latest bash -c '
            dnf install -y -q mesa-libGL mesa-libEGL libglvnd-opengl \
              libxkbcommon libxkbcommon-x11 fontconfig dbus-libs glib2 \
              libX11 libxcb > /dev/null
            /dist/InventCraft/InventCraft --checkupdate | tee /tmp/u.txt
            grep -q PASS /tmp/u.txt'

      - name: The published build, on Arch (for information)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.7 -p "*linux*" -D old || exit 0
          mkdir -p oldbuild && tar -xzf old/*.tar.gz -C oldbuild
          docker run --rm -v "$PWD/oldbuild:/old" -v "$PWD/examples:/examples" archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth mesa \
              libglvnd libxkbcommon-x11 xcb-util-cursor xcb-util-wm \
              xcb-util-image xcb-util-keysyms xcb-util-renderutil libxi libsm \
              fontconfig ttf-dejavu dbus > /dev/null
            cd /tmp
            LIBGL_DEBUG=verbose timeout 40 xvfb-run -a -s "-screen 0 1600x1000x24" \
              /old/DATUM/DATUM /examples/excavator/Bucket.pdat > /tmp/old.txt 2>&1
            grep -iE "GL rendering|MESA|libstdc|GLIBCXX|failed to load|Error" /tmp/old.txt | grep -v Fontconfig | head -30'

      - name: Desktop install script
        run: |
          cp docs/LINUX.md dist/InventCraft/README-LINUX.md
          cp tools/linux/install.sh dist/InventCraft/install.sh
          chmod +x dist/InventCraft/install.sh
          # tried for real, into a scratch home: the copy, the menu entry,
          # the icons and the file types, and then taken off again
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME=
          mkdir -p "$HOME"
          sh dist/InventCraft/install.sh
          test -x "$HOME/.local/share/InventCraft/InventCraft"
          grep -q 'Exec=".*/InventCraft" %f' "$HOME/.local/share/applications/inventcraft.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/inventcraft.png"
          grep -q 'icpart' "$HOME/.local/share/mime/packages/inventcraft.xml"
          sh "$HOME/.local/share/InventCraft/install.sh" --remove
          test ! -e "$HOME/.local/share/InventCraft"
          test ! -e "$HOME/.local/share/applications/inventcraft.desktop"

      - name: Pack
        id: pack
        run: |
          name="InventCraft-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz"
          tar -czf "$name" -C dist InventCraft
          ls -l "$name"
          sha256sum "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "InventCraft ${tag#v}" \
              --notes "See https://datum.iiteg.com/changelog.html"
          fi
          gh release upload "$tag" "${{ steps.pack.outputs.name }}" --clobber
